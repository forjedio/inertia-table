name: Release

on:
  release:
    types: [created]

jobs:
  packagist:
    runs-on: ubuntu-latest
    name: Update Packagist

    steps:
      - name: Notify Packagist
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}"

  npm-publish:
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.package }} to npm

    concurrency:
      group: npm-publish-${{ matrix.package }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        package: [react, vue]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@forjedio'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Set version from tag
        working-directory: ${{ matrix.package }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Check if version already published
        id: check
        working-directory: ${{ matrix.package }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "Already published: $PKG_NAME@$VERSION — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy LICENSE
        if: steps.check.outputs.skip != 'true'
        run: cp LICENSE ${{ matrix.package }}/LICENSE

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ matrix.package }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
